<body>
    <div class="carta">
        <div class="date" id="data-atual"></div>
        <p id="saudacao">Querido Joan,</p>
        <p id="mensagem">A encontrar a carta...</p>
        <p id="despedida"><br>Da tua mais amada, <br>Íris Bianca.</p>
    </div>

    <script>
        const cartas = {
        	"2026-06-10": "Só existem duas coisas mais solitária do que uma noite nas montanhas: os meus braços na tua ausência. Estou a guardar a covinha no meu peito para quando puderes voltar a unir o teu coração ao meu.<br> Normalmente quando os gajos têm no perfil do Hinge que gostam de caminhadas e viajar acabam por não gostar de verdade - é uma coisa que se diz para impressionar - mas agora que te conheço e vejo o quão aventureiro tu és, passo a perceber um bocadinho melhor o fado :)<br>É um misto de saudade, orgulho e esperança de que estejas a pensar em mim do mesmo modo que penso em ti.<br>Fiz-te este site para ser o nosso cantinho e para tornar especial o facto da nossa comunicação estar limitada. À medida que os dias vão passando ele vai apresentando uma carta diferente que eu deixei escritas com antecedência (mas continuo a ter oportunidade de editar o texto se o desejar). Já não programava há muito tempo e de repente tu foste a inspiração perfeita para o voltar a fazer. És a minha pessoa favorita, sem dúvida.<br>Espero que o tempo seja simpático contigo. E se não for, espero que sejas tu simpático com ele porque nada de mau pode acontecer a quem tem boas intenções e um coração puro hihihi.<br>Muuuitos beijinhos!",
            "2026-06-11": "Lembrei-me de uma coisa incrível para te contar! Quando estava a trabalhar no campo de férias era raro conseguir pôr os meninos a fazer uma atividade conjunta (cada um tinha os seus grupos e os seus interesses e estava tudo bem). Ainda assim, houve duas vezes que aproveitei o timming a meu favor e os juntei. Espero que não te tenha já contado esta história porque é hilariante e o efeito surpresa merece ser preservado.<br><br>A primeira vez que o fiz foi com um grupo de meninos mais velhos (dos 14-17) que convenci a jogar à Aldeia. Conheces a minha paixão por jogos de tabuleiro - e sabes que das coisas que mais aprecio são dinâmicas de grupo. Pois bem, juntei os dois na perfeição. A Aldeia pode ser jogada através de um sorteio de cartas que define as personagens ou com a atribuição das mesmas por parte de um narrador - eu!<br><br>Fui discreta quanto ao assunto, mas a verdade é que atribuí as posições mais favoráveis aos meninos envergonhados para que tivessem mais confiança na altura da discussão e votação de grupo e isso fosse um ponto de partida para a sua integração. Realmente ajudou.<br><br>No segundo caso, o grupo era mais novo (10-13) e havia uma separação de género enorme (como acaba por ser normal nessa idade). Depois do almoço, enquanto os meninos faziam a digestão antes de ir para a piscina, juntei os outros monitores e dei-lhes um plano: íamos dar 5 minutos aos miúdos para descobrirem o máximo possível sobre os outros. Mas como havíamos de fazer isso? Usando a separação a nosso favor - dissemos que os meninos tinham de descobrir 3 sonhos sobre o seu par e que as meninas tinham de descobrir 3 coisas que os rapazes tivessem feito e ainda não tinham contado aos pais. O grupo oposto não podia descobrir qual era a missão deles, por isso descrição era recomendada. Eu própria fiz os pares entre rapaz e rapariga consoante o nível de timidez que cada um apresentava (de modo a que o contraste não fosse muito grande, mas também não acabassem dois envergonhados juntos sem conversar). Iiiiiiiih, foi uma confusão! Alguma das outras monitoras disse às meninas que elas podiam mentir para os meninos não ganharem e toda a gente veio ter connosco a contar histórias mal contadas porque estavam demasiado concentrados em ganhar pontos para se ouvirem com curiosidade. Já para não falar de que eram as crianças que tinham sido vulneráveis que saíam penalizadas hahaha. Os miúdos divertiram-se nesse caos e é o que importa. Não foi o que eu imaginei que seria mas foi na mesma um motor de interação entre eles e logo depois deixaram de brincar separados. Acredites ou não - quando contabilizámos os pontos tinha sido um empate até à décima.<br><br>Conto-te isto agora para ver se te inspiro a aproveitar a montanha para conhecer melhor o grupo que te acompanha. Às vezes essas interações são mais difíceis em ambiente predominantemente masculino. Um dos meus jogos favoritos para conhecer as pessoas é duas verdade e uma mentira onde dizes 3 coisas: uma delas é mentira e as outras são verdade. Toda a gente vai desenterrar coisas surpreendentes sobre si para tentar enganar o grupo. A outra, surpreendentemente, são charadas. Gosto de observar as perguntas que as pessoas fazer e fazer uma reconstrução mental das suas preocupações. Espero que saibam algumas.<br><br>Quanto a nós, tenho uma ideia incrível para quando voltares: matching t-shirts! Vi umas muito fofas no Pinterest estes dias e estava a pensar que podíamos ter um encontro em que fazemos as nossas próprias. Eu levo todos os materiais naturalmente. Vai pensando no que gostavas de incluir - desde piadas a símbolos e mensagens políticas - e pode ser que até façamos mais do que um par <3 T’estimo molt, bona cosa!",
            "2026-06-12": "Mais um dia! Lembra-te de beber água e tirar muitas fotos para me mostrares depois. Amo-te!",
        };

        function carregarCarta() {
            const hoje = new Date();
            const ano = hoje.getFullYear();
            const mes = String(hoje.getMonth() + 1).padStart(2, '0');
            const dia = String(hoje.getDate()).padStart(2, '0');
            const dataFormatada = `${ano}-${mes}-${dia}`;

            document.getElementById('data-atual').innerText = hoje.toLocaleDateString('pt-PT', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            const mensagemElement = document.getElementById('mensagem');

            if (cartas[dataFormatada]) {
                mensagemElement.innerHTML = cartas[dataFormatada];
            } else {
                mensagemElement.innerHTML = "Não há uma carta para hoje. Aqui está um poema de Laércio Monteiro:<br>Falta de inspiração<br>Com ar de sufocação<br>Vontade de viver<br>Quando se está a morrer.<br><br>Ódio e rancor<br>Para esconder a dor<br>Pressa e ansiedade<br>Tentando matar a saudade.<br><br>Vendo o céu e indo ao inferno<br>Sentindo calor em pleno inverno<br>Não é febre ou qualquer enfermidade<br>Apenas a dor da saudade.<br><br>Mundo virtual e mundo real<br>Em um, só observo, no outro, eu encontro<br>E o que era doce, tornou-se sal.<br><br>Vou-me livrar dessa loucura<br>De um jeito ou de outro<br>Mesmo vomitando poesia pura.";
            }
        }

        carregarCarta();
    </script>
